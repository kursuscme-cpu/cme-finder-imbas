name: Uji bacaan Facebook

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL page dipisah koma"
        required: true

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.1-${{ runner.os }}
      - run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
      - run: node probe.mjs
        env:
          PROBE_URLS: ${{ inputs.urls }}

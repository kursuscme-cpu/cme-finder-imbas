name: Imbas Facebook

# This repository exists to be public.
#
# Reading a Facebook Page needs a real browser — a plain HTTP fetch only ever
# gets a login wall — and GitHub Actions is the one free place that will host
# one on a schedule. A private repository gets 2,000 minutes a month, which at
# this cadence is nowhere near enough; a public one is unlimited. So the
# scraper lives here on its own, and the application it feeds stays private.
#
# Nothing here is sensitive. The two values the job needs are repository
# secrets, and the list of Pages comes from the application at runtime.
on:
  schedule:
    # Hourly — and the job then scans every eight minutes from inside itself.
    #
    # `*/8 * * * *` looked right and was not honoured. Measured over six
    # consecutive runs the gaps were 47, 53, 65, 82 and 39 minutes: GitHub
    # treats a high-frequency schedule as a suggestion and collapses it under
    # load. An hourly schedule is honoured reliably, so the workflow takes the
    # hour and `scan-fb.mjs` controls the minutes.
    #
    # Facebook shows a logged-out visitor only the single most recent post per
    # Page, so how much we catch is decided by how often we look. The script
    # reads a moving window of eight of the fifteen Pages, so an eight-minute
    # pass puts every Page in front of us about every fifteen minutes.
    - cron: "0 * * * *"
  workflow_dispatch:
    # So the window width can be measured against Facebook's real behaviour
    # rather than argued about. The default is what the schedule uses.
    inputs:
      pages_per_run:
        description: "Berapa page satu pusingan"
        default: "8"
      loop_minutes:
        description: "Berapa lama kerja ini berulang"
        default: "56"

# The newest run wins.
#
# The job occupies most of the hour and the schedule fires late, so the next
# one arrives while this one is still looping. Queueing it looked polite and
# was measured doing harm: the run at 21:26 was cancelled while waiting, and
# nothing scanned between 21:25 and 22:28 — a 63-minute blind spot. Replacing
# the old run instead costs only the tail of a loop that was nearly done.
concurrency:
  group: imbas
  cancel-in-progress: true

jobs:
  imbas:
    runs-on: ubuntu-latest
    # Long enough for the internal loop plus setup, short enough that a wedged
    # run cannot hold the concurrency group past its hour.
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Downloading Chromium costs more than the scraping does. Caching it is
      # what keeps a run short enough to repeat this often.
      - name: Cache pelayar
        id: cache-pelayar
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.1-${{ runner.os }}

      - name: Pasang Playwright
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.62.1
          if [ "${{ steps.cache-pelayar.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Imbas dan hantar
        env:
          CME_FINDER_URL: ${{ secrets.CME_FINDER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          FB_RUN_EVERY_MS: "480000"
          FB_PAGES_PER_RUN: ${{ inputs.pages_per_run || '8' }}
          FB_LOOP_MINUTES: ${{ inputs.loop_minutes || '56' }}
        run: node scan-fb.mjs
